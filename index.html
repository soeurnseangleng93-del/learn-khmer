<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សៀវភៅពាក្យសព្ទកុមារ (Kids Khmer Word Book)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-amber-600 drop-shadow-sm mb-2">សៀវភៅពាក្យសព្ទរបស់ខ្ញុំ 📖</h1>
            <p class="text-emerald-600 text-xl font-semibold">ចុចលើរូបភាពដើម្បីស្តាប់សំឡេងអាន!</p>
        </header>

        <div id="word-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
        </div>
    </div>

    <script>
        const vocabularyData = [
    { word: "កកេរ", emoji: " ", Audio: "audio/korke.m4a" },
    { word: "ឆាឆៅ", emoji: " ", Audio: "audio/charchav.m4a" },
    { word: "ចរចា", emoji: " ", Audio: "audio/chorchar.m4a" },
    { word: "កែខៃ", emoji: " ", Audio: "audio/kaekhai.m4a" },
    { word: "ឆេះខោ", emoji: " ", Audio: "audio/cheskhou.m4a" },
    { word: "ខះក", emoji: "", Audio: "audio/kharskor.m4a" }, // ជំនួសដោយឯកសារដែលមានស្រាប់ ឬដាក់បញ្ចូលឯកសារថ្មី
    { word: "បាល់", emoji: "⚽", Audio: "audio/bal.m4a" },
    { word: "សង្គ្រាម", emoji: "⚔️", Audio: "audio/sangkram.m4a" }
    ];

        const gridContainer = document.getElementById('word-grid');

        // ដោះស្រាយបញ្ហា Voice ផ្ទុកយឺត (ដាក់នៅខាងក្រៅ Loop ម្ដងបានហើយ)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        vocabularyData.forEach((item) => {
            const card = document.createElement('div');
            card.className = "bg-white border-4 border-emerald-300 rounded-3xl p-5 flex flex-col items-center justify-between shadow-md hover:shadow-xl hover:border-emerald-400 transition-all transform hover:-translate-y-1 active:scale-95 cursor-pointer";
            
            card.innerHTML = `
                <div class="text-7xl my-2 selection:bg-transparent">${item.emoji}</div>
                <h3 class="text-2xl font-bold text-slate-700 tracking-wide my-2">${item.word}</h3>
                <button class="mt-2 bg-emerald-400 text-white rounded-full p-2 border-2 border-white shadow-sm flex items-center justify-center w-11 h-11 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H3a1 1 0 01-1-1V8a1 1 0 011-1h1.586l3.657-3.657a1 1 0 011.14-.267zM15.707 5.293a1 1 0 010 1.414 4 4 0 000 5.657 1 1 0 01-1.414-1.414 2 2 0 000-2.829 1 1 0 011.414-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            `;

            // Click listener តែមួយគត់ដែលមានការកំណត់សម្លេងភាសាខ្មែរត្រឹមត្រូវ
            // លេងសំឡេងពី File .m4a ពេលចុចលើកាត
            card.addEventListener('click', () => {
                const sound = new Audio(item.Audio);
                sound.play().catch(error => {
                    console.log("Error playing audio:", error);
                });
            });

            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
